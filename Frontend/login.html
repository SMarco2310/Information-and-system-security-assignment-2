<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · University Grade Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-layout">
    <section class="card auth-card">
      <div class="icon-tile" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
      </div>
      <h1 id="title">Sign in with passkey</h1>
      <p class="subtitle" id="subtitle">Use your fingerprint, face or security key. No password to remember.</p>

      <form class="form" id="form">
        <div class="input-icon" id="name-field" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <input id="fullname" autocomplete="name" placeholder="Full name" aria-label="Full name">
        </div>
        <div class="input-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <input id="identifier" autocomplete="username webauthn" placeholder="University email or ID" aria-label="University email or ID">
        </div>

        <button class="btn block" id="submit" type="submit">Sign in with passkey</button>
        <p class="status" id="status" role="status" hidden></p>

        <div class="divider"><span id="divider-text">or</span></div>
        <button class="btn outline block" id="toggle" type="button">Register a new passkey</button>

        <fieldset class="preview">
          <legend>Demo only: preview as</legend>
          <label><input type="radio" name="role" value="student" checked> Student</label>
          <label><input type="radio" name="role" value="lecturer"> Lecturer</label>
        </fieldset>
      </form>

      <p class="note">Passkeys can’t be phished and are never sent to the portal.</p>
    </section>
  </div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
